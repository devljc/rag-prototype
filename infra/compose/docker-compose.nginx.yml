services:
  nginx:
    image: nginx:1.25
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"   # ← 앱에선 http://localhost:8080/v1 로 호출
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ragnet

networks:
  ragnet:
    name: ragnet