worker_processes auto;

events { worker_connections 1024; }

http {
  # 전송/연결 기본 튜닝
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  client_max_body_size 25m;

  # vLLM 업스트림 (호스트에서 실행되는 vLLM 서버)
  upstream vllm_upstream {
    least_conn;
    server host.docker.internal:11434 max_fails=3 fail_timeout=10s;
    # server host.docker.internal:8001 ... ← 레플리카 추가 시
    keepalive 100;
  }

  server {
    listen 8080;

    # OpenAI 호환 스트리밍 엔드포인트 프록시
    location /v1/ {
      proxy_pass http://vllm_upstream;

      # HTTP/1.1 + keep-alive
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # 스트리밍 최적화
      proxy_buffering off;
      proxy_request_buffering off;
      gzip off;
      add_header X-Accel-Buffering no;

      # 타임아웃
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_connect_timeout 60s;

      tcp_nodelay on;
    }

    # 헬스체크
    location = /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}